<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faekson Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          animation: {
            'liquid-float': 'liquidFloat 12s ease-in-out infinite',
            'fade-in-up': 'fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'skeleton': 'skeletonPulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            liquidFloat: {
              '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(40px, -50px) scale(1.15)' },
              '66%': { transform: 'translate(-30px, 30px) scale(0.9)' },
            },
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(16px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            skeletonPulse: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.4' },
            }
          }
        }
      }
    }
  </script>
  <style>
    .liquid-bg-blob {
      position: absolute;
      filter: blur(100px);
      z-index: -1;
      opacity: 0.6;
      pointer-events: none;
      border-radius: 50%;
    }

    html.dark body {
      background: #060913;
      color: #f1f5f9;
      background-attachment: fixed;
    }
    html:not(.dark) body {
      background: #f1f5f9;
      color: #0f172a;
      background-attachment: fixed;
    }

    /* 極致液態玻璃質感 (Liquid Glassmorphism) */
    .liquid-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08), inset 0 1px 0 0 rgba(255, 255, 255, 0.6);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    html.dark .liquid-card {
      background: rgba(13, 19, 33, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
    }

    .liquid-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 25px 50px -12px rgba(59, 130, 246, 0.25), inset 0 1px 0 0 rgba(255, 255, 255, 0.8);
      border-color: rgba(59, 130, 246, 0.5);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: rgba(150, 150, 150, 0.25);
      border-radius: 4px;
    }
  </style>
</head>
<body class="flex flex-col font-sans min-h-screen relative overflow-x-hidden transition-colors duration-300" onclick="hideSuggestions(event)">

  <!-- 背景流動光暈 -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-[-1]">
    <div class="liquid-bg-blob w-[550px] h-[550px] bg-blue-500/25 dark:bg-blue-600/20 top-[-10%] left-[-10%] animate-liquid-float"></div>
    <div class="liquid-bg-blob w-[650px] h-[650px] bg-indigo-500/20 dark:bg-indigo-900/25 bottom-[-10%] right-[-10%] animate-liquid-float" style="animation-delay: -6s;"></div>
  </div>

  <!-- 導航列 -->
  <header class="sticky top-0 z-40 backdrop-blur-2xl bg-white/60 dark:bg-slate-950/60 border-b border-slate-200/50 dark:border-slate-800/50 transition-colors">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <button onclick="resetToHome()" class="flex items-center gap-2 group text-left focus:outline-none">
        <img src="https://i.ibb.co/sJRpyNmz/Background-Eraser-20260727-192939994.png" alt="Faekson Logo" class="h-7 w-auto object-contain dark:invert-0 invert transition group-hover:scale-105" />
      </button>

      <div class="flex items-center gap-2">
        <button onclick="toggleCalculatorModal()" class="p-2.5 rounded-xl liquid-card hover:bg-white/80 dark:hover:bg-slate-800/80 text-slate-700 dark:text-slate-200 transition" title="小算盤">
          <i class="fa-solid fa-calculator text-blue-500 text-sm"></i>
        </button>
        <button onclick="toggleBookmarksView()" id="bookmark-toggle-btn" class="flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold liquid-card hover:bg-white/80 dark:hover:bg-slate-800/80 text-slate-700 dark:text-slate-200 transition">
          <i class="fa-solid fa-bookmark text-amber-500"></i>
          <span class="hidden sm:inline">收藏</span>
          <span id="bookmark-count-badge" class="bg-blue-600 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold">0</span>
        </button>
        <button onclick="toggleHistoryModal()" class="p-2.5 rounded-xl liquid-card hover:bg-white/80 dark:hover:bg-slate-800/80 text-slate-700 dark:text-slate-200 transition" title="歷史紀錄">
          <i class="fa-solid fa-clock-rotate-left text-sm"></i>
        </button>
        <button onclick="toggleNotesModal()" class="p-2.5 rounded-xl liquid-card hover:bg-white/80 dark:hover:bg-slate-800/80 text-slate-700 dark:text-slate-200 transition relative" title="便條紙">
          <i class="fa-solid fa-note-sticky text-yellow-500 text-sm"></i>
          <span id="notes-indicator" class="absolute top-2 right-2 w-2 h-2 bg-yellow-500 rounded-full hidden"></span>
        </button>
        <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl liquid-card hover:bg-white/80 dark:hover:bg-slate-800/80 text-slate-700 dark:text-slate-200 transition" title="切換外觀">
          <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區：保留舊版基本排版架構 -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 py-10 flex flex-col gap-6 justify-center transition-all duration-300" id="main-layout">

    <div id="home-hero-zone" class="flex flex-col items-center justify-center py-6 text-center transition-all duration-300">
      <div class="cursor-pointer mb-3 transform hover:scale-105 transition duration-300" onclick="resetToHome()">
        <img src="https://i.ibb.co/sJRpyNmz/Background-Eraser-20260727-192939994.png" alt="Faekson Logo" class="w-56 sm:w-68 h-auto object-contain dark:invert-0 invert drop-shadow-md" />
      </div>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 font-medium">雙引擎極速搜尋，頂級液態質感</p>
    </div>

    <!-- 搜尋列與即時建議 -->
    <div class="flex flex-col gap-4 relative">
      <form onsubmit="submitSearch(event)" class="relative group">
        <div class="w-full liquid-card rounded-2xl p-2 flex items-center shadow-lg transition-all focus-within:ring-2 focus-within:ring-blue-500/40">
          <div class="pl-3.5 pr-2.5 text-slate-400 dark:text-blue-400">
            <i class="fa-solid fa-magnifying-glass text-base"></i>
          </div>
          <input 
            type="text" 
            id="search-input"
            oninput="handleTyping()"
            onfocus="handleTyping()"
            placeholder="輸入關鍵字或直接計算數學式 (例: 50*3)..." 
            autocomplete="off"
            class="w-full bg-transparent border-none outline-none text-slate-900 dark:text-white placeholder-slate-400 text-sm sm:text-base px-2 py-1.5"
          />
          <button type="button" id="clear-btn" onclick="clearSearch()" class="hidden pr-3 text-slate-400 hover:text-slate-600 dark:hover:text-white transition">
            <i class="fa-solid fa-circle-xmark text-base"></i>
          </button>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-xl text-xs sm:text-sm shrink-0 transition shadow-md">
            搜尋
          </button>
        </div>

        <div id="suggestions-box" class="hidden absolute left-0 right-0 top-full mt-2 liquid-card rounded-2xl shadow-xl overflow-hidden z-50 py-1.5 animate-fade-in-up">
          <div id="suggestions-list" class="flex flex-col"></div>
        </div>
      </form>

      <!-- 分類標籤列 -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1 custom-scrollbar text-xs justify-start sm:justify-center" id="category-bar">
        <button onclick="filterCategory('即時新聞', event)" class="cat-btn px-3.5 py-1.5 rounded-xl font-medium liquid-card hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 whitespace-nowrap transition">即時新聞</button>
        <button onclick="filterCategory('FR', event)" class="cat-btn px-3.5 py-1.5 rounded-xl font-medium liquid-card hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 whitespace-nowrap transition">FR 專區</button>
        <button onclick="filterCategory('ai', event)" class="cat-btn px-3.5 py-1.5 rounded-xl font-medium liquid-card hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 whitespace-nowrap transition">AI 工具</button>
        <button onclick="filterCategory('程式', event)" class="cat-btn px-3.5 py-1.5 rounded-xl font-medium liquid-card hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 whitespace-nowrap transition">開發設計</button>
        <button onclick="filterCategory('遊戲', event)" class="cat-btn px-3.5 py-1.5 rounded-xl font-medium liquid-card hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 whitespace-nowrap transition">娛樂遊戲</button>
        <button onclick="filterCategory('免費', event)" class="cat-btn px-3.5 py-1.5 rounded-xl font-medium liquid-card hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 whitespace-nowrap transition">免費資源</button>
      </div>
    </div>

    <!-- 搜尋結果展示區 -->
    <div id="results-wrapper" class="hidden flex-col gap-6 mt-2 animate-fade-in-up">
      
      <!-- 即時計算機小卡 (當輸入數學式時顯示) -->
      <div id="calc-result-box" class="hidden liquid-card rounded-2xl p-4 flex items-center justify-between border border-blue-500/30 bg-blue-500/5">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center text-blue-500">
            <i class="fa-solid fa-calculator text-lg"></i>
          </div>
          <div>
            <div class="text-xs text-slate-400 font-medium">計算結果</div>
            <div id="calc-expr-text" class="text-sm text-slate-700 dark:text-slate-300"></div>
          </div>
        </div>
        <div id="calc-val-text" class="text-lg font-bold text-blue-600 dark:text-blue-400 font-mono"></div>
      </div>

      <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <button onclick="switchResultTab('local')" id="tab-local-btn" class="px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white transition shadow-sm">
            本地資料庫 (<span id="local-count">0</span>)
          </button>
          <button onclick="switchResultTab('cloud')" id="tab-cloud-btn" class="px-4 py-2 rounded-xl text-xs font-semibold liquid-card text-slate-600 dark:text-slate-300 transition">
            網路引擎 (<span id="cloud-count">0</span>)
          </button>
        </div>
        <span id="search-time-stats" class="text-[11px] text-slate-400"></span>
      </div>

      <div id="local-pane" class="flex flex-col gap-3.5">
        <div id="local-results-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5"></div>
      </div>

      <div id="cloud-pane" class="hidden flex-col gap-3.5">
        <div id="cloud-results-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5"></div>
      </div>
    </div>

  </main>

  <!-- 小算盤 Modal -->
  <div id="calculator-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="liquid-card rounded-3xl max-w-xs w-full p-5 shadow-2xl animate-fade-in-up flex flex-col gap-4">
      <div class="flex items-center justify-between pb-2 border-b border-slate-200 dark:border-slate-800">
        <h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-calculator text-blue-500"></i> 小算盤</h3>
        <button onclick="toggleCalculatorModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="calc-screen" class="w-full bg-slate-100 dark:bg-slate-900/80 rounded-2xl p-4 text-right font-mono text-2xl font-bold text-slate-800 dark:text-white truncate border border-slate-200 dark:border-slate-800">0</div>
      <div class="grid grid-cols-4 gap-2 text-sm font-semibold">
        <button onclick="calcInput('C')" class="p-3 rounded-xl bg-red-500/10 text-red-500 hover:bg-red-500/20 transition">C</button>
        <button onclick="calcInput('(')" class="p-3 rounded-xl liquid-card hover:bg-slate-200 dark:hover:bg-slate-800 transition">(</button>
        <button onclick="calcInput(')')" class="p-3 rounded-xl liquid-card hover:bg-slate-200 dark:hover:bg-slate-800 transition">)</button>
        <button onclick="calcInput('/')" class="p-3 rounded-xl bg-blue-500/10 text-blue-500 hover:bg-blue-500/20 transition">÷</button>
        <button onclick="calcInput('7')" class="p-3 rounded-xl liquid-card hover:bg-slate-200 dark:hover:bg-slate-800 transition">7</button>
        <button onclick="calcInput('8')" class="p-3 rounded-xl liquid-card hover:bg-slate-200 dark:hover:bg-slate-800 transition">8</button>
        <button onclick="calcInput('9')" class="p-3 rounded-xl liquid-card hover:bg-slate-200 dark:hover:bg-slate-800 transition">9</button>
        <button onclick="calcInput('*')" class="p-3 rounded-xl bg-blue-500/10 text-blue-500 hover:bg-blue-500/20 transition">×</button>
        <button onclick="calcInput('4')" class="p-3 rounded-xl liquid-card hover:bg-slate-200 dark:hover:bg-slate-800 transition">4</button>
        <button onclick="calcInput('5')" class="p-3 rounded-xl liquid-card hover:bg-slate-200 dark:hover:bg-slate-800 transition">5</button>
        <button onclick="calcInput('6')" class="p-3 rounded-xl liquid-card hover:bg-slate-200 dark:hover:bg-slate-800 transition">6</button>
        <button onclick="calcInput('-')" class="p-3 rounded-xl bg-blue-500/10 text-blue-500 hover:bg-blue-500/20 transition">-</button>
        <button onclick="calcInput('1')" class="p-3 rounded-xl liquid-card hover:bg-slate-200 dark:hover:bg-slate-800 transition">1</button>
        <button onclick="calcInput('2')" class="p-3 rounded-xl liquid-card hover:bg-slate-200 dark:hover:bg-slate-800 transition">2</button>
        <button onclick="calcInput('3')" class="p-3 rounded-xl liquid-card hover:bg-slate-200 dark:hover:bg-slate-800 transition">3</button>
        <button onclick="calcInput('+')" class="p-3 rounded-xl bg-blue-500/10 text-blue-500 hover:bg-blue-500/20 transition">+</button>
        <button onclick="calcInput('0')" class="col-span-2 p-3 rounded-xl liquid-card hover:bg-slate-200 dark:hover:bg-slate-800 transition">0</button>
        <button onclick="calcInput('.')" class="p-3 rounded-xl liquid-card hover:bg-slate-200 dark:hover:bg-slate-800 transition">.</button>
        <button onclick="calcEqual()" class="p-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white transition">=</button>
      </div>
    </div>
  </div>

  <!-- 歷史紀錄 Modal -->
  <div id="history-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="liquid-card rounded-2xl max-w-sm w-full p-5 shadow-2xl animate-fade-in-up flex flex-col max-h-[75vh]">
      <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
        <h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-clock-rotate-left text-blue-500"></i> 搜尋歷史紀錄</h3>
        <button onclick="toggleHistoryModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="history-list" class="flex-1 overflow-y-auto py-3 custom-scrollbar flex flex-col gap-2"></div>
      <div class="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-between items-center">
        <button onclick="clearHistory()" class="text-xs text-red-500 hover:underline font-medium">清除紀錄</button>
        <button onclick="toggleHistoryModal()" class="px-3 py-1.5 liquid-card text-xs font-semibold rounded-xl text-slate-700 dark:text-slate-300">關閉</button>
      </div>
    </div>
  </div>

  <!-- 便條紙 Modal -->
  <div id="notes-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="liquid-card rounded-2xl max-w-md w-full p-5 shadow-2xl animate-fade-in-up flex flex-col h-[400px]">
      <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
        <h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-note-sticky text-yellow-500"></i> 快速筆記</h3>
        <button onclick="toggleNotesModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <textarea id="quick-notes-input" oninput="saveQuickNotes()" placeholder="在此隨手記錄想法..." class="flex-1 w-full bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 rounded-xl p-3.5 mt-3 resize-none outline-none text-slate-800 dark:text-slate-200 text-xs sm:text-sm focus:ring-1 focus:ring-yellow-500 custom-scrollbar"></textarea>
      <div class="pt-3 flex justify-between items-center text-xs text-slate-400">
        <span>即時儲存中</span>
        <button onclick="toggleNotesModal()" class="px-3 py-1.5 bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-bold rounded-xl transition">完成</button>
      </div>
    </div>
  </div>

  
  <footer class="mt-auto border-t border-slate-200/50 dark:border-slate-800/50 py-5 text-center text-xs text-slate-400">
    <p>© 2027 Faekson Search</p>
  </footer>

  <div id="toast" class="fixed bottom-5 right-5 transform translate-y-16 opacity-0 liquid-card text-slate-800 dark:text-white px-4 py-2.5 rounded-xl shadow-xl flex items-center gap-2.5 text-xs font-semibold transition-all duration-300 pointer-events-none z-50">
    <i class="fa-solid fa-circle-check text-emerald-500"></i>
    <span id="toast-msg">操作成功</span>
  </div>

  <script>
    let allData = [];
    let bookmarks = JSON.parse(localStorage.getItem('faekson_bookmarks')) || [];
    let searchHistory = JSON.parse(localStorage.getItem('faekson_history')) || [];
    let currentCategory = 'all';
    let isShowingBookmarks = false;
    let activeTab = 'local';
    let calcInputString = '';

    async function init() {
      updateBookmarkBadge();
      initQuickNotes();
      try {
        const res = await fetch('https://raw.githubusercontent.com/FR2027/Faekson_2/refs/heads/main/data.json?v=' + new Date().getTime());
        if (!res.ok) throw new Error();
        allData = await res.json();
      } catch (err) {
        allData = [];
      }
    }

    function checkMathCalculation(query) {
      try {
        const cleanExpr = query.replace(/[^0-9+\-*/().]/g, '');
        if (/^[0-9+\-*/().\s]+$/.test(cleanExpr) && /[+\-*/]/.test(cleanExpr)) {
          const result = Function('"use strict";return (' + cleanExpr + ')')();
          if (result !== undefined && !isNaN(result)) {
            return { expr: cleanExpr, val: result };
          }
        }
      } catch (e) {}
      return null;
    }

    function renderSkeletonCards() {
      return `
        <div class="liquid-card rounded-2xl p-4 flex flex-col gap-3 animate-skeleton">
          <div class="w-full h-32 bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
          <div class="w-3/4 h-4 bg-slate-200 dark:bg-slate-800 rounded"></div>
          <div class="w-full h-8 bg-slate-200 dark:bg-slate-800 rounded"></div>
        </div>
      `;
    }

    function renderCardHTML(item, index, prefixId) {
      const isBookmarked = bookmarks.some(b => b.id === item.id);
      const imageUrl = item.image || item.img || item.cover;
      const safeSnippet = item.snippet || item.description || '';
      const uniqueId = item.id || (prefixId + '_' + index);

      return `
        <div class="liquid-card rounded-2xl p-4 flex flex-col justify-between">
          <div>
            ${imageUrl ? `<div class="w-full h-36 mb-3 rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-900 border border-slate-200/50 dark:border-slate-800/50 relative group/img"><img src="${imageUrl}" alt="${item.title || ''}" class="w-full h-full object-cover group-hover/img:scale-105 transition duration-300" onerror="this.style.display='none'" /></div>` : ''}
            <div class="flex items-start justify-between gap-2 mb-2">
              <a href="${item.url || '#'}" target="_blank" class="font-bold text-sm text-slate-900 dark:text-white hover:text-blue-600 dark:hover:text-blue-400 transition line-clamp-1 flex items-center gap-1.5 group/link">
                <span>${item.title || '無標題'}</span>
                <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-0 group-hover/link:opacity-100 transition"></i>
              </a>
              <div class="flex items-center gap-1 shrink-0">
                <button onclick="copyUrl('${item.url || ''}')" title="複製連結" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-200/50 dark:hover:bg-slate-800 transition"><i class="fa-regular fa-copy text-xs"></i></button>
                <button onclick="toggleBookmark('${uniqueId}')" title="收藏" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800 transition"><i class="fa-${isBookmarked ? 'solid' : 'regular'} fa-star text-xs ${isBookmarked ? 'text-amber-400' : ''}"></i></button>
              </div>
            </div>
            <p class="text-xs text-slate-600 dark:text-slate-300 line-clamp-2 leading-relaxed mb-3">${safeSnippet}</p>
          </div>
          <div>
            ${item.tags && item.tags.length > 0 ? `<div class="flex flex-wrap gap-1 mb-3">${item.tags.map(t => `<span onclick="clickTagSearch('${t}')" class="cursor-pointer text-[10px] font-medium px-2 py-0.5 rounded-md bg-blue-500/10 text-blue-600 dark:text-blue-300 hover:bg-blue-500/20 transition">#${t}</span>`).join('')}</div>` : ''}
            <a href="${item.url || '#'}" target="_blank" class="text-[10px] font-mono text-slate-400 dark:text-slate-500 truncate block hover:text-blue-500 transition"><i class="fa-solid fa-globe mr-1 opacity-60"></i>${item.url || ''}</a>
          </div>
        </div>
      `;
    }

    function renderLocalResults(list) {
      const container = document.getElementById('local-results-container');
      document.getElementById('local-count').innerText = list.length;
      if (list.length === 0) {
        container.innerHTML = `<div class="col-span-full py-8 text-center text-xs text-slate-400 liquid-card rounded-xl">無本地資料</div>`;
        return;
      }
      container.innerHTML = list.map((item, index) => renderCardHTML(item, index, 'local')).join('');
    }

    function renderCloudResults(list) {
      const container = document.getElementById('cloud-results-container');
      document.getElementById('cloud-count').innerText = list.length;
      if (list.length === 0) {
        container.innerHTML = `<div class="col-span-full py-8 text-center text-xs text-slate-400 liquid-card rounded-xl">無網路搜尋結果</div>`;
        return;
      }
      container.innerHTML = list.map((item, index) => renderCardHTML(item, index, 'cloud')).join('');
    }

    function switchToSearchMode() {
      document.getElementById('home-hero-zone').classList.add('hidden');
      document.getElementById('main-layout').classList.remove('justify-center');
      document.getElementById('results-wrapper').classList.remove('hidden');
      document.getElementById('results-wrapper').classList.add('flex');
    }

    function handleTyping() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      document.getElementById('clear-btn').classList.toggle('hidden', query === '');
      const box = document.getElementById('suggestions-box');
      if (!query) { box.classList.add('hidden'); return; }

      const matched = allData.filter(i => (i.title && i.title.toLowerCase().includes(query)) || (i.tags || []).some(t => t.toLowerCase().includes(query))).slice(0, 4);
      if (matched.length === 0) { box.classList.add('hidden'); return; }

      document.getElementById('suggestions-list').innerHTML = matched.map(i => `
        <div onclick="selectSuggestion('${i.title}')" class="px-3.5 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer flex items-center justify-between transition text-xs text-slate-700 dark:text-slate-200">
          <div class="flex items-center gap-2"><i class="fa-solid fa-magnifying-glass text-[10px] text-blue-500"></i><span>${i.title}</span></div>
        </div>
      `).join('');
      box.classList.remove('hidden');
    }

    function hideSuggestions(e) {
      if (!e.target.closest('#suggestions-box') && !e.target.closest('#search-input')) {
        document.getElementById('suggestions-box').classList.add('hidden');
      }
    }

    function selectSuggestion(text) {
      document.getElementById('search-input').value = text;
      document.getElementById('suggestions-box').classList.add('hidden');
      executeSearch();
    }

    function submitSearch(e) {
      if (e) e.preventDefault();
      document.getElementById('suggestions-box').classList.add('hidden');
      executeSearch();
    }

    function clickTagSearch(tag) {
      document.getElementById('search-input').value = tag;
      executeSearch();
    }

    async function executeSearch() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      if (!query && currentCategory === 'all' && !isShowingBookmarks) { resetToHome(); return; }

      switchToSearchMode();
      if (isShowingBookmarks) isShowingBookmarks = false;

      // 檢查數學計算
      const mathCheck = checkMathCalculation(query);
      const calcBox = document.getElementById('calc-result-box');
      if (mathCheck) {
        calcBox.classList.remove('hidden');
        document.getElementById('calc-expr-text').innerText = mathCheck.expr + ' =';
        document.getElementById('calc-val-text').innerText = mathCheck.val;
      } else {
        calcBox.classList.add('hidden');
      }

      if (query && !searchHistory.includes(query)) {
        searchHistory.unshift(query);
        if (searchHistory.length > 15) searchHistory.pop();
        localStorage.setItem('faekson_history', JSON.stringify(searchHistory));
      }

      document.getElementById('local-results-container').innerHTML = renderSkeletonCards();
      document.getElementById('cloud-results-container').innerHTML = renderSkeletonCards();
      const startTime = performance.now();

      let filteredLocal = allData;
      if (currentCategory !== 'all') {
        filteredLocal = filteredLocal.filter(i => (i.tags || []).some(t => t.toLowerCase() === currentCategory.toLowerCase()) || (i.title && i.title.toLowerCase().includes(currentCategory.toLowerCase())));
      }
      if (query) {
        filteredLocal = filteredLocal.filter(i => (i.title && i.title.toLowerCase().includes(query)) || (i.snippet && i.snippet.toLowerCase().includes(query)) || (i.tags || []).some(t => t.toLowerCase().includes(query)));
      }
      renderLocalResults(filteredLocal);

      let cloudResults = [];
      if (query && !mathCheck) {
        try {
          const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://html.duckduckgo.com/html/?q=' + encodeURIComponent(query))}`);
          const data = await res.json();
          if (data && data.contents) {
            const doc = new DOMParser().parseFromString(data.contents, 'text/html');
            doc.querySelectorAll('.result').forEach((el, idx) => {
              const t = el.querySelector('.result__title');
              const s = el.querySelector('.result__snippet');
              const l = el.querySelector('.result__url');
              if (t && l) cloudResults.push({ id: 'cloud_' + idx, title: t.textContent.trim(), snippet: s ? s.textContent.trim() : '', url: l.href || '#', tags: ['網路'] });
            });
          }
        } catch (err) {}
      }
      renderCloudResults(cloudResults.slice(0, 8));
      document.getElementById('search-time-stats').innerText = `耗時 ${(performance.now() - startTime).toFixed(0)}ms`;
    }

    function switchResultTab(tab) {
      activeTab = tab;
      const localBtn = document.getElementById('tab-local-btn');
      const cloudBtn = document.getElementById('tab-cloud-btn');
      if (tab === 'local') {
        localBtn.className = 'px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white transition shadow-sm';
        cloudBtn.className = 'px-4 py-2 rounded-xl text-xs font-semibold liquid-card text-slate-600 dark:text-slate-300 transition';
        document.getElementById('local-pane').classList.remove('hidden');
        document.getElementById('cloud-pane').classList.add('hidden');
      } else {
        cloudBtn.className = 'px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white transition shadow-sm';
        localBtn.className = 'px-4 py-2 rounded-xl text-xs font-semibold liquid-card text-slate-600 dark:text-slate-300 transition';
        document.getElementById('cloud-pane').classList.remove('hidden');
        document.getElementById('local-pane').classList.add('hidden');
      }
    }

    function filterCategory(cat, e) {
      currentCategory = currentCategory === cat ? 'all' : cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
      });
      if (currentCategory !== 'all' && e && e.currentTarget) {
        e.currentTarget.classList.add('bg-blue-600', 'text-white');
      }
      executeSearch();
    }

    function resetToHome() {
      document.getElementById('search-input').value = '';
      document.getElementById('clear-btn').classList.add('hidden');
      document.getElementById('suggestions-box').classList.add('hidden');
      currentCategory = 'all';
      isShowingBookmarks = false;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('bg-blue-600', 'text-white'));
      document.getElementById('home-hero-zone').classList.remove('hidden');
      document.getElementById('main-layout').classList.add('justify-center');
      document.getElementById('results-wrapper').classList.add('hidden');
      document.getElementById('results-wrapper').classList.remove('flex');
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      document.getElementById('clear-btn').classList.add('hidden');
      executeSearch();
    }

    function toggleBookmark(id) {
      const idx = bookmarks.findIndex(b => b.id === id);
      const item = allData.find(i => i.id === id);
      if (idx > -1) { bookmarks.splice(idx, 1); showToast('已取消收藏'); }
      else if (item) { bookmarks.push(item); showToast('已加入收藏'); }
      localStorage.setItem('faekson_bookmarks', JSON.stringify(bookmarks));
      updateBookmarkBadge();
      if (isShowingBookmarks) renderLocalResults(bookmarks);
      else executeSearch();
    }

    function updateBookmarkBadge() {
      document.getElementById('bookmark-count-badge').innerText = bookmarks.length;
    }

    function toggleBookmarksView() {
      isShowingBookmarks = !isShowingBookmarks;
      if (isShowingBookmarks) {
        switchToSearchMode();
        switchResultTab('local');
        renderLocalResults(bookmarks);
        renderCloudResults([]);
        showToast('顯示我的收藏');
      } else {
        executeSearch();
      }
    }

    function toggleCalculatorModal() {
      document.getElementById('calculator-modal').classList.toggle('hidden');
    }

    function calcInput(val) {
      const screen = document.getElementById('calc-screen');
      if (val === 'C') { calcInputString = ''; screen.innerText = '0'; return; }
      calcInputString += val;
      screen.innerText = calcInputString;
    }

    function calcEqual() {
      const screen = document.getElementById('calc-screen');
      try {
        const res = Function('"use strict";return (' + calcInputString + ')')();
        screen.innerText = res;
        calcInputString = String(res);
      } catch (e) {
        screen.innerText = '錯誤';
        calcInputString = '';
      }
    }

    function toggleHistoryModal() {
      const modal = document.getElementById('history-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        const list = document.getElementById('history-list');
        list.innerHTML = searchHistory.length === 0 ? `<p class="text-center text-xs text-slate-400 py-4">無歷史紀錄</p>` :
          searchHistory.map(item => `<div class="flex items-center justify-between px-3 py-2 rounded-xl liquid-card"><span onclick="selectHistory('${item}')" class="text-xs text-slate-700 dark:text-slate-200 cursor-pointer flex-1 truncate">${item}</span><button onclick="removeHistory('${item}')" class="text-slate-400 hover:text-red-500 px-2 text-xs"><i class="fa-solid fa-xmark"></i></button></div>`).join('');
      }
    }

    function selectHistory(term) {
      document.getElementById('search-input').value = term;
      toggleHistoryModal();
      executeSearch();
    }

    function removeHistory(term) {
      searchHistory = searchHistory.filter(i => i !== term);
      localStorage.setItem('faekson_history', JSON.stringify(searchHistory));
      toggleHistoryModal();
      toggleHistoryModal();
    }

    function clearHistory() {
      searchHistory = [];
      localStorage.removeItem('faekson_history');
      toggleHistoryModal();
      toggleHistoryModal();
      showToast('已清除歷史');
    }

    function toggleNotesModal() { document.getElementById('notes-modal').classList.toggle('hidden'); }
    function initQuickNotes() {
      const n = localStorage.getItem('faekson_quick_notes') || '';
      document.getElementById('quick-notes-input').value = n;
      if (n.trim()) document.getElementById('notes-indicator').classList.remove('hidden');
    }
    function saveQuickNotes() {
      const v = document.getElementById('quick-notes-input').value;
      localStorage.setItem('faekson_quick_notes', v);
      document.getElementById('notes-indicator').classList.toggle('hidden', !v.trim());
    }

    function copyUrl(u) {
      if (u) navigator.clipboard.writeText(u).then(() => showToast('已複製連結'));
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      t.classList.remove('translate-y-16', 'opacity-0');
      setTimeout(() => t.classList.add('translate-y-16', 'opacity-0'), 1800);
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        icon.className = 'fa-solid fa-sun text-sm text-amber-500';
        showToast('明亮模式');
      } else {
        html.classList.add('dark');
        icon.className = 'fa-solid fa-moon text-sm text-slate-200';
        showToast('深色模式');
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
