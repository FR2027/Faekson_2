<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faekson Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          },
          animation: {
            'liquid-float': 'liquidFloat 8s ease-in-out infinite',
            'pulse-glow': 'pulseGlow 4s ease-in-out infinite',
            'fade-in-up': 'fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            liquidFloat: {
              '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.95)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.4' },
              '50%': { opacity: '0.8' },
            },
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(16px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 液態玻璃背景動態光暈 */
    .liquid-bg-blob {
      position: absolute;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.6;
      pointer-events: none;
      border-radius: 50%;
      transition: background 0.5s ease;
    }

    html.dark body {
      background: #030712;
      color: #f8fafc;
      background-attachment: fixed;
    }
    html:not(.dark) body {
      background: #f8fafc;
      color: #0f172a;
      background-attachment: fixed;
    }

    /* 極致液態玻璃效果 (Liquid Glass) */
    .liquid-glass {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
    html:not(.dark) .liquid-glass {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.8);
    }

    /* 卡片懸停流光與浮動感 */
    .result-card {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .result-card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 20px 40px -15px rgba(59, 130, 246, 0.3);
      border-color: rgba(59, 130, 246, 0.5);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: rgba(150, 150, 150, 0.3);
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background-color: rgba(150, 150, 150, 0.5);
    }
  </style>
</head>
<body class="flex flex-col font-sans transition-colors duration-500 min-h-screen relative overflow-x-hidden" onclick="hideSuggestions(event)">

  <!-- 液態動態背景光暈 -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-[-1]">
    <div class="liquid-bg-blob w-[500px] h-[500px] bg-blue-600/30 dark:bg-blue-600/20 top-[-10%] left-[-10%] animate-liquid-float"></div>
    <div class="liquid-bg-blob w-[600px] h-[600px] bg-indigo-500/20 dark:bg-indigo-900/30 bottom-[-20%] right-[-10%] animate-liquid-float" style="animation-delay: -3s;"></div>
    <div class="liquid-bg-blob w-[400px] h-[400px] bg-purple-500/20 dark:bg-purple-900/20 top-[40%] right-[30%] animate-liquid-float" style="animation-delay: -5s;"></div>
  </div>

  <!-- 頂部導航列 -->
  <header id="app-header" class="sticky top-0 z-50 liquid-glass border-b border-white/10 transition-all duration-300 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <button onclick="resetToHome()" class="flex items-center gap-2 group text-left focus:outline-none">
        <img src="https://i.ibb.co/sJRpyNmz/Background-Eraser-20260727-192939994.png" alt="Faekson Logo" class="h-8 w-auto object-contain dark:invert-0 invert transition transform group-hover:scale-105" />
      </button>

      <!-- 右側功能按鈕區 -->
      <div class="flex items-center gap-2.5">
        <!-- 歷史紀錄按鈕 -->
        <button onclick="toggleHistoryModal()" class="flex items-center gap-2 px-3 py-2 rounded-xl text-sm font-medium bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 border border-black/10 dark:border-white/10 transition shadow-sm text-slate-700 dark:text-slate-200" title="搜尋歷史紀錄">
          <i class="fa-solid fa-clock-rotate-left text-blue-500"></i>
          <span class="hidden md:inline">歷史紀錄</span>
        </button>

        <!-- 筆記小工具按鈕 -->
        <button onclick="toggleNotesModal()" class="flex items-center gap-2 px-3 py-2 rounded-xl text-sm font-medium bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 border border-black/10 dark:border-white/10 transition shadow-sm text-slate-700 dark:text-slate-200 relative" title="筆記">
          <i class="fa-solid fa-note-sticky text-yellow-500"></i>
          <span class="hidden md:inline">筆記</span>
          <span id="notes-indicator" class="absolute top-1.5 right-1.5 w-2 h-2 bg-yellow-500 rounded-full hidden"></span>
        </button>

        <!-- 收藏按鈕 -->
        <button onclick="toggleBookmarksView()" id="bookmark-toggle-btn" class="flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm font-medium bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 border border-black/10 dark:border-white/10 transition shadow-sm text-slate-700 dark:text-slate-200">
          <i class="fa-solid fa-bookmark text-amber-500 dark:text-amber-400"></i>
          <span class="hidden sm:inline">我的收藏</span>
          <span id="bookmark-count-badge" class="bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full font-bold shadow">0</span>
        </button>

        <!-- 主題切換按鈕 -->
        <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 border border-black/10 dark:border-white/10 text-slate-700 dark:text-slate-200 transition shadow-sm">
          <i id="theme-icon" class="fa-solid fa-moon text-base"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-12 flex flex-col gap-8 justify-center transition-all duration-300" id="main-layout">

    <!-- 首頁 Logo 區 -->
    <div id="home-hero-zone" class="flex flex-col items-center justify-center py-8 transition-all duration-500">
      <div class="cursor-pointer mb-4 transform hover:scale-105 transition duration-500" onclick="resetToHome()">
        <img src="https://i.ibb.co/sJRpyNmz/Background-Eraser-20260727-192939994.png" alt="Faekson Logo" class="w-64 sm:w-80 h-auto object-contain dark:invert-0 invert drop-shadow-[0_10px_25px_rgba(59,130,246,0.3)]" />
      </div>
      <p class="text-sm text-slate-500 dark:text-slate-400 font-medium tracking-wide">本地智能搜尋引擎</p>
    </div>

    <!-- 搜尋列與即時建議 -->
    <div class="flex flex-col gap-6 relative">
      <form onsubmit="submitSearch(event)" class="relative group">
        <div class="w-full liquid-glass rounded-2xl p-2 flex items-center shadow-2xl transition-all duration-300 focus-within:ring-2 focus-within:ring-blue-500/40">
          <div class="pl-4 pr-3 text-slate-400 dark:text-blue-400">
            <i class="fa-solid fa-magnifying-glass text-lg"></i>
          </div>
          <input 
            type="text" 
            id="search-input"
            oninput="handleTyping()"
            onfocus="handleTyping()"
            placeholder="搜尋網頁名稱、關鍵字..." 
            autocomplete="off"
            class="w-full bg-transparent border-none outline-none text-slate-900 dark:text-white placeholder-slate-400 text-base px-2 py-1"
          />
          <button type="button" id="clear-btn" onclick="clearSearch()" class="hidden pr-3 text-slate-400 hover:text-slate-700 dark:text-slate-400 dark:hover:text-white transition">
            <i class="fa-solid fa-circle-xmark text-lg"></i>
          </button>
          <button type="submit" class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-medium px-6 py-3 rounded-xl hover:brightness-110 shadow-lg shadow-blue-600/30 shrink-0 transition active:scale-95">
            搜尋
          </button>
        </div>

        <!-- 智慧即時提示框 -->
        <div id="suggestions-box" class="hidden absolute left-0 right-0 top-full mt-3 liquid-glass rounded-2xl shadow-2xl overflow-hidden z-50 py-2 animate-fade-in-up">
          <div class="px-4 py-2 text-[11px] font-bold text-slate-400 dark:text-slate-400 tracking-wider uppercase">熱門與智慧搜尋建議</div>
          <div id="suggestions-list" class="flex flex-col"></div>
        </div>
      </form>

      <!-- 分類標籤列 -->
      <div class="flex items-center gap-2.5 overflow-x-auto pb-2 custom-scrollbar text-sm justify-start sm:justify-center" id="category-bar">
        <button onclick="filterCategory('即時新聞', event)" class="cat-btn px-4 py-2 rounded-xl font-medium bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-slate-700 dark:text-slate-200 whitespace-nowrap transition shadow-sm border border-black/5 dark:border-white/5">即時新聞</button>
        <button onclick="filterCategory('FR', event)" class="cat-btn px-4 py-2 rounded-xl font-medium bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-slate-700 dark:text-slate-200 whitespace-nowrap transition shadow-sm border border-black/5 dark:border-white/5">FR 專區</button>
        <button onclick="filterCategory('ai', event)" class="cat-btn px-4 py-2 rounded-xl font-medium bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-slate-700 dark:text-slate-200 whitespace-nowrap transition shadow-sm border border-black/5 dark:border-white/5">AI 工具</button>
        <button onclick="filterCategory('程式', event)" class="cat-btn px-4 py-2 rounded-xl font-medium bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-slate-700 dark:text-slate-200 whitespace-nowrap transition shadow-sm border border-black/5 dark:border-white/5">開發設計</button>
        <button onclick="filterCategory('遊戲', event)" class="cat-btn px-4 py-2 rounded-xl font-medium bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-slate-700 dark:text-slate-200 whitespace-nowrap transition shadow-sm border border-black/5 dark:border-white/5">娛樂遊戲</button>
        <button onclick="filterCategory('免費', event)" class="cat-btn px-4 py-2 rounded-xl font-medium bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-slate-700 dark:text-slate-200 whitespace-nowrap transition shadow-sm border border-black/5 dark:border-white/5">免費資源</button>
      </div>
    </div>

    <!-- 搜尋結果展示區 -->
    <div id="results-wrapper" class="hidden flex-col gap-4 mt-2 animate-fade-in-up">
      <!-- 智慧小工具嵌入區 (如計算機結果) -->
      <div id="widget-container"></div>

      <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 px-2">
        <span id="search-stats" class="font-medium">正在載入數據...</span>
        <span id="current-mode-label" class="font-semibold text-blue-600 dark:text-blue-400 bg-blue-500/10 px-2.5 py-1 rounded-lg">搜尋結果</span>
      </div>

      <div id="results-container" class="grid grid-cols-1 md:grid-cols-2 gap-5">
      </div>
    </div>

  </main>

  <!-- 歷史紀錄 Modal -->
  <div id="history-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="liquid-glass rounded-3xl max-w-md w-full p-6 shadow-2xl animate-fade-in-up flex flex-col max-h-[80vh]">
      <div class="flex items-center justify-between pb-4 border-b border-black/10 dark:border-white/10">
        <h3 class="font-bold text-lg flex items-center gap-2 text-slate-900 dark:text-white">
          <i class="fa-solid fa-clock-rotate-left text-blue-500"></i> 搜尋歷史紀錄
        </h3>
        <button onclick="toggleHistoryModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div id="history-list" class="flex-1 overflow-y-auto py-4 custom-scrollbar flex flex-col gap-2">
        <!-- 動態填入歷史 -->
      </div>
      <div class="pt-3 border-t border-black/10 dark:border-white/10 flex justify-between items-center">
        <button onclick="clearHistory()" class="text-xs text-red-500 hover:underline">清除所有紀錄</button>
        <button onclick="toggleHistoryModal()" class="px-4 py-2 bg-blue-600 text-white text-xs font-medium rounded-xl">關閉</button>
      </div>
    </div>
  </div>

  <!-- 便條紙 Modal -->
  <div id="notes-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="liquid-glass rounded-3xl max-w-lg w-full p-6 shadow-2xl animate-fade-in-up flex flex-col h-[450px]">
      <div class="flex items-center justify-between pb-4 border-b border-black/10 dark:border-white/10">
        <h3 class="font-bold text-lg flex items-center gap-2 text-slate-900 dark:text-white">
          <i class="fa-solid fa-note-sticky text-yellow-500"></i> 本地便條紙
        </h3>
        <button onclick="toggleNotesModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <textarea 
        id="quick-notes-input" 
        oninput="saveQuickNotes()"
        placeholder="在這裡隨手記錄靈感、網址或代辦事項...儲存於本地" 
        class="flex-1 w-full bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-2xl p-4 mt-4 resize-none outline-none text-slate-800 dark:text-slate-200 text-sm focus:ring-2 focus:ring-yellow-500/30 custom-scrollbar"
      ></textarea>
      <div class="pt-3 flex justify-between items-center text-xs text-slate-400">
        <span id="notes-status">已自動儲存</span>
        <button onclick="toggleNotesModal()" class="px-4 py-2 bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-bold rounded-xl transition">完成</button>
      </div>
    </div>
  </div>

  <!-- 頁尾 -->
  <footer class="mt-auto border-t border-white/10 py-6 text-center text-xs text-slate-400 dark:text-slate-500 liquid-glass">
    <p>© 2027 FR科技公司開發 Faekson本地搜尋引擎</p>
  </footer>

  <!-- Toast 通知 -->
  <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 liquid-glass text-slate-900 dark:text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-sm font-medium transition-all duration-300 pointer-events-none z-50">
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-500 text-base"></i>
    <span id="toast-msg">操作成功</span>
  </div>

  <!-- 核心邏輯 JavaScript -->
  <script>
    let allData = [];
    let bookmarks = JSON.parse(localStorage.getItem('faekson_bookmarks')) || [];
    let searchHistory = JSON.parse(localStorage.getItem('faekson_history')) || [];
    let currentCategory = 'all';
    let isShowingBookmarks = false;

    async function init() {
      updateBookmarkBadge();
      initQuickNotes();
      try {
        const fetchUrl = 'https://raw.githubusercontent.com/FR2027/Faekson_2/refs/heads/main/data.json?v=' + new Date().getTime();
        const res = await fetch(fetchUrl);
        if (!res.ok) throw new Error('HTTP 錯誤: ' + res.status);
        allData = await res.json();
        console.log('數據載入成功，共 ' + allData.length + ' 筆資料');
      } catch (err) {
        console.error('載入數據失敗:', err);
        const stats = document.getElementById('search-stats');
        if (stats) stats.innerText = '資料載入失敗';
      }
    }

    // 智能計算機與小工具解析
    function checkSmartWidgets(query) {
      const container = document.getElementById('widget-container');
      container.innerHTML = '';

      // 簡單數學計算機功能 (支援 +, -, *, /, %)
      try {
        if (/^[\d\+\-\*\/\.\(\)\s\%]+$/.test(query) && query.length > 1 && /\d/.test(query)) {
          // 安全評估計算式
          let result = Function('"use strict";return (' + query + ')')();
          if (result !== undefined && !isNaN(result)) {
            container.innerHTML = `
              <div class="liquid-glass rounded-2xl p-4 flex items-center justify-between shadow-lg border border-blue-500/30 animate-fade-in-up">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center text-blue-500 font-bold">
                    <i class="fa-solid fa-calculator"></i>
                  </div>
                  <div>
                    <div class="text-xs text-slate-400">快速計算結果</div>
                    <div class="text-lg font-bold text-slate-900 dark:text-white font-mono">${query} = ${result}</div>
                  </div>
                </div>
                <button onclick="copyUrl('${result}')" class="px-3 py-1.5 bg-blue-500/10 hover:bg-blue-500/20 text-blue-600 dark:text-blue-400 text-xs rounded-lg transition font-medium">複製結果</button>
              </div>
            `;
          }
        }
      } catch (e) {
        // 忽略非合法計算式
      }
    }

    function renderResults(list, searchTime = 0) {
      const container = document.getElementById('results-container');
      const stats = document.getElementById('search-stats');

      if (stats) {
        stats.innerText = `找到 ${list.length} 個相關結果 ${searchTime ? `(${searchTime} 毫秒)` : ''}`;
      }

      if (list.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-400 dark:text-slate-500 liquid-glass rounded-3xl">
            <i class="fa-solid fa-folder-open text-5xl mb-3 block opacity-40 text-blue-500"></i>
            <p class="text-base font-semibold text-slate-700 dark:text-slate-300">未找到符合條件的網站</p>
            <p class="text-xs mt-1.5 opacity-80">請嘗試換個關鍵字、計算式或切換上方的分類標籤</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map((item, index) => {
        const isBookmarked = bookmarks.some(b => b.id === item.id);
        const imageUrl = item.image || item.img || item.cover;
        const safeSnippet = item.snippet || item.description || '';
        const delayStyle = `animation-delay: ${index * 0.05}s`;

        return `
          <div class="result-card liquid-glass rounded-3xl p-6 flex flex-col justify-between shadow-lg" style="${delayStyle}">
            <div>
              ${imageUrl ? `
                <div class="w-full h-44 mb-4 rounded-2xl overflow-hidden bg-slate-100 dark:bg-slate-800 border border-white/5 relative group/img">
                  <img src="${imageUrl}" alt="${item.title || ''}" class="w-full h-full object-cover group-hover/img:scale-105 transition duration-500" onerror="this.style.display='none'" />
                </div>
              ` : ''}

              <div class="flex items-start justify-between gap-3 mb-2.5">
                <a href="${item.url || '#'}" target="_blank" class="font-bold text-base text-slate-900 dark:text-white hover:text-blue-600 dark:hover:text-blue-400 transition line-clamp-1 flex items-center gap-2 group/link">
                  <span>${item.title || '無標題'}</span>
                  <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-0 group-hover/link:opacity-100 transition -translate-y-0.5"></i>
                </a>
                
                <div class="flex items-center gap-1.5 shrink-0">
                  <button onclick="copyUrl('${item.url || ''}')" title="複製連結" class="p-2 rounded-xl text-slate-400 hover:text-slate-700 dark:text-slate-400 dark:hover:text-white hover:bg-black/5 dark:hover:bg-white/10 transition">
                    <i class="fa-regular fa-copy text-sm"></i>
                  </button>
                  <button onclick="toggleBookmark(${item.id})" title="加入/取消收藏" class="p-2 rounded-xl text-slate-400 hover:bg-black/5 dark:hover:bg-white/10 transition">
                    <i class="fa-${isBookmarked ? 'solid' : 'regular'} fa-star text-sm ${isBookmarked ? 'text-amber-400 drop-shadow' : ''}"></i>
                  </button>
                </div>
              </div>

              <p class="text-xs text-slate-600 dark:text-slate-300 line-clamp-2 leading-relaxed mb-5">${safeSnippet}</p>
            </div>

            <div>
              <div class="flex flex-wrap gap-1.5 mb-4">
                ${(item.tags || []).map(tag => {
                  const safeTag = String(tag).replace(/'/g, "\\'");
                  return `<span onclick="clickTagSearch('${safeTag}')" class="cursor-pointer text-[11px] font-medium px-2.5 py-1 rounded-lg bg-blue-500/10 text-blue-600 dark:text-blue-300 hover:bg-blue-600/20 transition">#${tag}</span>`;
                }).join('')}
              </div>

              <a href="${item.url || '#'}" target="_blank" class="text-[11px] font-mono text-slate-400 dark:text-slate-500 truncate block hover:text-blue-500 transition">
                <i class="fa-solid fa-globe mr-1.5 opacity-60"></i>${item.url || ''}
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function switchToSearchMode() {
      document.getElementById('home-hero-zone').classList.add('hidden');
      document.getElementById('main-layout').classList.remove('justify-center');
      document.getElementById('results-wrapper').classList.remove('hidden');
      document.getElementById('results-wrapper').classList.add('flex');
    }

    function handleTyping() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      const clearBtn = document.getElementById('clear-btn');
      const box = document.getElementById('suggestions-box');
      const list = document.getElementById('suggestions-list');

      clearBtn.classList.toggle('hidden', query === '');

      if (!query) {
        box.classList.add('hidden');
        return;
      }

      const matchedTitles = allData
        .filter(item => 
          (item.title && String(item.title).toLowerCase().includes(query)) || 
          (item.tags || []).some(t => String(t).toLowerCase().includes(query))
        )
        .slice(0, 5);

      if (matchedTitles.length === 0) {
        box.classList.add('hidden');
        return;
      }

      list.innerHTML = matchedTitles.map(item => {
        const safeTitle = (item.title || '').replace(/'/g, "\\'");
        return `
          <div onclick="selectSuggestion('${safeTitle}')" class="px-4 py-2.5 hover:bg-black/5 dark:hover:bg-white/10 cursor-pointer flex items-center justify-between transition text-sm text-slate-800 dark:text-slate-200">
            <div class="flex items-center gap-3">
              <i class="fa-solid fa-magnifying-glass text-xs text-blue-500"></i>
              <span>${item.title || ''}</span>
            </div>
            <i class="fa-solid fa-arrow-up-left text-xs text-slate-400 opacity-60"></i>
          </div>
        `;
      }).join('');

      box.classList.remove('hidden');
    }

    function hideSuggestions(e) {
      const box = document.getElementById('suggestions-box');
      if (!e.target.closest('#suggestions-box') && !e.target.closest('#search-input')) {
        box.classList.add('hidden');
      }
    }

    function selectSuggestion(text) {
      document.getElementById('search-input').value = text;
      document.getElementById('suggestions-box').classList.add('hidden');
      executeSearch();
    }

    function submitSearch(e) {
      if (e) e.preventDefault();
      document.getElementById('suggestions-box').classList.add('hidden');
      executeSearch();
    }

    function clickTagSearch(tag) {
      document.getElementById('search-input').value = tag;
      executeSearch();
    }

    function executeSearch() {
      const startTime = performance.now();
      const query = document.getElementById('search-input').value.trim().toLowerCase();

      if (!query && currentCategory === 'all' && !isShowingBookmarks) {
        resetToHome();
        return;
      }

      switchToSearchMode();

      if (isShowingBookmarks) {
        isShowingBookmarks = false;
      }
      // 紀錄搜尋歷史
      if (query && !searchHistory.includes(query)) {
        searchHistory.unshift(query);
        if (searchHistory.length > 20) searchHistory.pop();
        localStorage.setItem('faekson_history', JSON.stringify(searchHistory));
      }

      // 檢測智慧小工具
      checkSmartWidgets(query);

      let filtered = allData;

      if (currentCategory !== 'all') {
        filtered = filtered.filter(item => 
          (item.tags || []).some(t => String(t).toLowerCase() === currentCategory.toLowerCase()) ||
          (item.title && String(item.title).toLowerCase().includes(currentCategory.toLowerCase()))
        );
      }

      if (query) {
        filtered = filtered.filter(item => 
          (item.title && String(item.title).toLowerCase().includes(query)) ||
          (item.snippet && String(item.snippet).toLowerCase().includes(query)) ||
          (item.description && String(item.description).toLowerCase().includes(query)) ||
          (item.tags || []).some(t => String(t).toLowerCase().includes(query))
        );
      }

      const endTime = performance.now();
      renderResults(filtered, (endTime - startTime).toFixed(1));
    }

    function filterCategory(cat, e) {
      if (currentCategory === cat) {
        currentCategory = 'all';
      } else {
        currentCategory = cat;
      }
      
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white', 'shadow-md', 'border-transparent');
        btn.classList.add('bg-black/5', 'dark:bg-white/10', 'text-slate-700', 'dark:text-slate-200', 'border-black/5', 'dark:border-white/5');
      });
      
      if (currentCategory !== 'all' && e && e.currentTarget) {
        e.currentTarget.classList.remove('bg-black/5', 'dark:bg-white/10', 'text-slate-700', 'dark:text-slate-200', 'border-black/5', 'dark:border-white/5');
        e.currentTarget.classList.add('bg-blue-600', 'text-white', 'shadow-md', 'border-transparent');
      }

      executeSearch();
    }

    function resetToHome() {
      document.getElementById('search-input').value = '';
      document.getElementById('clear-btn').classList.add('hidden');
      document.getElementById('suggestions-box').classList.add('hidden');
      document.getElementById('widget-container').innerHTML = '';
      currentCategory = 'all';
      isShowingBookmarks = false;
      document.getElementById('current-mode-label').innerText = '搜尋結果';

      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white', 'shadow-md', 'border-transparent');
        btn.classList.add('bg-black/5', 'dark:bg-white/10', 'text-slate-700', 'dark:text-slate-200', 'border-black/5', 'dark:border-white/5');
      });

      document.getElementById('home-hero-zone').classList.remove('hidden');
      document.getElementById('main-layout').classList.add('justify-center');
      document.getElementById('results-wrapper').classList.add('hidden');
      document.getElementById('results-wrapper').classList.remove('flex');
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      document.getElementById('clear-btn').classList.add('hidden');
      document.getElementById('suggestions-box').classList.add('hidden');
      executeSearch();
    }

    function toggleBookmark(id) {
      const index = bookmarks.findIndex(b => b.id === id);
      const targetItem = allData.find(item => item.id === id);

      if (index > -1) {
        bookmarks.splice(index, 1);
        showToast('已取消收藏');
      } else if (targetItem) {
        bookmarks.push(targetItem);
        showToast('已加入我的收藏');
      }

      localStorage.setItem('faekson_bookmarks', JSON.stringify(bookmarks));
      updateBookmarkBadge();

      if (isShowingBookmarks) {
        renderResults(bookmarks);
      } else {
        executeSearch();
      }
    }

    function updateBookmarkBadge() {
      const badge = document.getElementById('bookmark-count-badge');
      if (badge) badge.innerText = bookmarks.length;
    }

    function toggleBookmarksView() {
      isShowingBookmarks = !isShowingBookmarks;
      const label = document.getElementById('current-mode-label');
      document.getElementById('widget-container').innerHTML = '';

      if (isShowingBookmarks) {
        switchToSearchMode();
        if (label) label.innerText = '我的收藏清單';
        renderResults(bookmarks);
        showToast('切換至我的收藏');
      } else {
        if (label) label.innerText = '搜尋結果';
        executeSearch();
      }
    }

    // 歷史紀錄功能
    function toggleHistoryModal() {
      const modal = document.getElementById('history-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        renderHistoryList();
      }
    }

    function renderHistoryList() {
      const listContainer = document.getElementById('history-list');
      if (searchHistory.length === 0) {
        listContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-6">目前沒有搜尋紀錄</p>`;
        return;
      }
      listContainer.innerHTML = searchHistory.map(item => `
        <div class="flex items-center justify-between p-2.5 rounded-xl bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 transition">
          <span onclick="selectHistoryItem('${item}')" class="text-xs text-slate-700 dark:text-slate-200 cursor-pointer flex-1 truncate"><i class="fa-solid fa-clock mr-2 text-slate-400"></i>${item}</span>
          <button onclick="removeHistoryItem('${item}')" class="text-slate-400 hover:text-red-500 px-2 text-xs"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `).join('');
    }

    function selectHistoryItem(term) {
      document.getElementById('search-input').value = term;
      toggleHistoryModal();
      executeSearch();
    }

    function removeHistoryItem(term) {
      searchHistory = searchHistory.filter(i => i !== term);
      localStorage.setItem('faekson_history', JSON.stringify(searchHistory));
      renderHistoryList();
    }

    function clearHistory() {
      searchHistory = [];
      localStorage.removeItem('faekson_history');
      renderHistoryList();
      showToast('已清除所有歷史紀錄');
    }

    // 快速便條紙功能
    function toggleNotesModal() {
      const modal = document.getElementById('notes-modal');
      modal.classList.toggle('hidden');
    }

    function initQuickNotes() {
      const savedNotes = localStorage.getItem('faekson_quick_notes') || '';
      const textarea = document.getElementById('quick-notes-input');
      if (textarea) textarea.value = savedNotes;
      if (savedNotes.trim() !== '') {
        document.getElementById('notes-indicator').classList.remove('hidden');
      }
    }

    function saveQuickNotes() {
      const val = document.getElementById('quick-notes-input').value;
      localStorage.setItem('faekson_quick_notes', val);
      const indicator = document.getElementById('notes-indicator');
      if (val.trim() !== '') {
        indicator.classList.remove('hidden');
      } else {
        indicator.classList.add('hidden');
      }
    }

    function copyUrl(url) {
      if (!url) return;
      navigator.clipboard.writeText(url).then(() => {
        showToast('已成功複製到剪貼簿！');
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      if (toast && toastMsg) {
        toastMsg.innerText = msg;
        toast.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => {
          toast.classList.add('translate-y-20', 'opacity-0');
        }, 2000);
      }
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        icon.className = 'fa-solid fa-sun text-base text-amber-500';
        showToast('已切換至明亮模式');
      } else {
        html.classList.add('dark');
        icon.className = 'fa-solid fa-moon text-base text-slate-200';
        showToast('已切換至深色模式');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      init();
    });
  </script>
</body>
</html>
