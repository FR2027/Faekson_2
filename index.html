<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faekson Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          animation: {
            'liquid-float': 'liquidFloat 10s ease-in-out infinite',
            'fade-in-up': 'fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'skeleton': 'skeletonPulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            liquidFloat: {
              '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -40px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.95)' },
            },
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(16px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            skeletonPulse: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.4' },
            }
          }
        }
      }
    }
  </script>
  <style>
    .liquid-bg-blob {
      position: absolute;
      filter: blur(90px);
      z-index: -1;
      opacity: 0.5;
      pointer-events: none;
      border-radius: 50%;
    }

    html.dark body {
      background: #090d16;
      color: #f1f5f9;
      background-attachment: fixed;
    }
    html:not(.dark) body {
      background: #f8fafc;
      color: #0f172a;
      background-attachment: fixed;
    }

    .clean-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 0, 0, 0.06);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
      transition: all 0.3s ease;
    }
    html.dark .clean-card {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
    }

    .clean-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 35px -10px rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.4);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: rgba(150, 150, 150, 0.25);
      border-radius: 4px;
    }
  </style>
</head>
<body class="flex flex-col font-sans min-h-screen relative overflow-x-hidden transition-colors duration-300" onclick="hideSuggestions(event)">

  <!-- 背景流動光暈 -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-[-1]">
    <div class="liquid-bg-blob w-[500px] h-[500px] bg-blue-500/20 dark:bg-blue-600/15 top-[-5%] left-[-5%] animate-liquid-float"></div>
    <div class="liquid-bg-blob w-[600px] h-[600px] bg-indigo-500/15 dark:bg-indigo-950/30 bottom-[-10%] right-[-5%] animate-liquid-float" style="animation-delay: -5s;"></div>
  </div>

  <!-- 簡潔導航列 -->
  <header class="sticky top-0 z-40 backdrop-blur-xl bg-white/70 dark:bg-slate-950/70 border-b border-slate-200/60 dark:border-slate-800/60 transition-colors">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      
      <!-- Logo 區 -->
      <button onclick="resetToHome()" class="flex items-center gap-2 group text-left focus:outline-none">
        <img src="https://i.ibb.co/sJRpyNmz/Background-Eraser-20260727-192939994.png" alt="Faekson Logo" class="h-7 w-auto object-contain dark:invert-0 invert transition group-hover:scale-105" />
      </button>

      <!-- 右側精簡功能按鈕 -->
      <div class="flex items-center gap-2">
        <button onclick="toggleBookmarksView()" id="bookmark-toggle-btn" class="flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition border border-slate-200/50 dark:border-slate-700/50">
          <i class="fa-solid fa-bookmark text-amber-500"></i>
          <span class="hidden sm:inline">收藏</span>
          <span id="bookmark-count-badge" class="bg-blue-600 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold">0</span>
        </button>

        <button onclick="toggleHistoryModal()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition border border-slate-200/50 dark:border-slate-700/50" title="歷史紀錄">
          <i class="fa-solid fa-clock-rotate-left text-sm"></i>
        </button>

        <button onclick="toggleNotesModal()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition border border-slate-200/50 dark:border-slate-700/50 relative" title="便條紙">
          <i class="fa-solid fa-note-sticky text-yellow-500 text-sm"></i>
          <span id="notes-indicator" class="absolute top-2 right-2 w-2 h-2 bg-yellow-500 rounded-full hidden"></span>
        </button>

        <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition border border-slate-200/50 dark:border-slate-700/50" title="切換外觀">
          <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 py-10 flex flex-col gap-6 justify-center transition-all duration-300" id="main-layout">

    <!-- 首頁 Hero 區 -->
    <div id="home-hero-zone" class="flex flex-col items-center justify-center py-6 text-center transition-all duration-300">
      <div class="cursor-pointer mb-3 transform hover:scale-105 transition duration-300" onclick="resetToHome()">
        <img src="https://i.ibb.co/sJRpyNmz/Background-Eraser-20260727-192939994.png" alt="Faekson Logo" class="w-56 sm:w-68 h-auto object-contain dark:invert-0 invert drop-shadow-md" />
      </div>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 font-medium">雙引擎極速搜尋，乾淨無廣告</p>
    </div>

    <!-- 搜尋列與即時建議 -->
    <div class="flex flex-col gap-4 relative">
      <form onsubmit="submitSearch(event)" class="relative group">
        <div class="w-full clean-card rounded-2xl p-2 flex items-center shadow-lg transition-all focus-within:ring-2 focus-within:ring-blue-500/40">
          <div class="pl-3.5 pr-2.5 text-slate-400 dark:text-blue-400">
            <i class="fa-solid fa-magnifying-glass text-base"></i>
          </div>
          <input 
            type="text" 
            id="search-input"
            oninput="handleTyping()"
            onfocus="handleTyping()"
            placeholder="輸入關鍵字搜尋..." 
            autocomplete="off"
            class="w-full bg-transparent border-none outline-none text-slate-900 dark:text-white placeholder-slate-400 text-sm sm:text-base px-2 py-1.5"
          />
          <button type="button" id="clear-btn" onclick="clearSearch()" class="hidden pr-3 text-slate-400 hover:text-slate-600 dark:hover:text-white transition">
            <i class="fa-solid fa-circle-xmark text-base"></i>
          </button>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-xl text-xs sm:text-sm shrink-0 transition shadow-md">
            搜尋
          </button>
        </div>

        <!-- 建議下拉選單 -->
        <div id="suggestions-box" class="hidden absolute left-0 right-0 top-full mt-2 clean-card rounded-2xl shadow-xl overflow-hidden z-50 py-1.5 animate-fade-in-up">
          <div id="suggestions-list" class="flex flex-col"></div>
        </div>
      </form>

      <!-- 分類標籤列 -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1 custom-scrollbar text-xs justify-start sm:justify-center" id="category-bar">
        <button onclick="filterCategory('即時新聞', event)" class="cat-btn px-3.5 py-1.5 rounded-xl font-medium bg-slate-200/60 dark:bg-slate-800/80 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 whitespace-nowrap transition">即時新聞</button>
        <button onclick="filterCategory('FR', event)" class="cat-btn px-3.5 py-1.5 rounded-xl font-medium bg-slate-200/60 dark:bg-slate-800/80 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 whitespace-nowrap transition">FR 專區</button>
        <button onclick="filterCategory('ai', event)" class="cat-btn px-3.5 py-1.5 rounded-xl font-medium bg-slate-200/60 dark:bg-slate-800/80 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 whitespace-nowrap transition">AI 工具</button>
        <button onclick="filterCategory('程式', event)" class="cat-btn px-3.5 py-1.5 rounded-xl font-medium bg-slate-200/60 dark:bg-slate-800/80 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 whitespace-nowrap transition">開發設計</button>
        <button onclick="filterCategory('遊戲', event)" class="cat-btn px-3.5 py-1.5 rounded-xl font-medium bg-slate-200/60 dark:bg-slate-800/80 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 whitespace-nowrap transition">娛樂遊戲</button>
        <button onclick="filterCategory('免費', event)" class="cat-btn px-3.5 py-1.5 rounded-xl font-medium bg-slate-200/60 dark:bg-slate-800/80 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 whitespace-nowrap transition">免費資源</button>
      </div>
    </div>

    <!-- 搜尋結果展示區 -->
    <div id="results-wrapper" class="hidden flex-col gap-6 mt-2 animate-fade-in-up">
      
      <!-- 結果切換 Tab -->
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <button onclick="switchResultTab('local')" id="tab-local-btn" class="px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white transition shadow-sm">
            本地資料庫 (<span id="local-count">0</span>)
          </button>
          <button onclick="switchResultTab('cloud')" id="tab-cloud-btn" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition">
            網路引擎 (<span id="cloud-count">0</span>)
          </button>
        </div>
        <span id="search-time-stats" class="text-[11px] text-slate-400"></span>
      </div>

      <!-- 本地結果容器 -->
      <div id="local-pane" class="flex flex-col gap-3.5">
        <div id="local-results-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5"></div>
      </div>

      <!-- 網路結果容器 -->
      <div id="cloud-pane" class="hidden flex-col gap-3.5">
        <div id="cloud-results-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5"></div>
      </div>
    </div>

  </main>

  <!-- 歷史紀錄 Modal -->
  <div id="history-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="clean-card rounded-2xl max-w-sm w-full p-5 shadow-2xl animate-fade-in-up flex flex-col max-h-[75vh]">
      <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
        <h3 class="font-bold text-sm flex items-center gap-2">
          <i class="fa-solid fa-clock-rotate-left text-blue-500"></i> 搜尋歷史紀錄
        </h3>
        <button onclick="toggleHistoryModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white transition">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>
      </div>
      <div id="history-list" class="flex-1 overflow-y-auto py-3 custom-scrollbar flex flex-col gap-2"></div>
      <div class="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-between items-center">
        <button onclick="clearHistory()" class="text-xs text-red-500 hover:underline font-medium">清除紀錄</button>
        <button onclick="toggleHistoryModal()" class="px-3 py-1.5 bg-slate-200 dark:bg-slate-800 text-xs font-semibold rounded-xl text-slate-700 dark:text-slate-300">關閉</button>
      </div>
    </div>
  </div>

  <!-- 便條紙 Modal -->
  <div id="notes-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="clean-card rounded-2xl max-w-md w-full p-5 shadow-2xl animate-fade-in-up flex flex-col h-[400px]">
      <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
        <h3 class="font-bold text-sm flex items-center gap-2">
          <i class="fa-solid fa-note-sticky text-yellow-500"></i> 快速筆記
        </h3>
        <button onclick="toggleNotesModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white transition">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>
      </div>
      <textarea 
        id="quick-notes-input" 
        oninput="saveQuickNotes()"
        placeholder="在此隨手記錄想法，自動儲存..." 
        class="flex-1 w-full bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 rounded-xl p-3.5 mt-3 resize-none outline-none text-slate-800 dark:text-slate-200 text-xs sm:text-sm focus:ring-1 focus:ring-yellow-500 custom-scrollbar"
      ></textarea>
      <div class="pt-3 flex justify-between items-center text-xs text-slate-400">
        <span id="notes-status">即時儲存中</span>
        <button onclick="toggleNotesModal()" class="px-3 py-1.5 bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-bold rounded-xl transition">完成</button>
      </div>
    </div>
  </div>

  <!-- 頁尾 -->
  <footer class="mt-auto border-t border-slate-200/60 dark:border-slate-800/60 py-5 text-center text-xs text-slate-400">
    <p>© 2027 Faekson Search</p>
  </footer>

  <!-- Toast 通知 -->
  <div id="toast" class="fixed bottom-5 right-5 transform translate-y-16 opacity-0 clean-card text-slate-800 dark:text-white px-4 py-2.5 rounded-xl shadow-xl flex items-center gap-2.5 text-xs font-semibold transition-all duration-300 pointer-events-none z-50">
    <i class="fa-solid fa-circle-check text-emerald-500"></i>
    <span id="toast-msg">操作成功</span>
  </div>

  <!-- 核心邏輯 -->
  <script>
    let allData = [];
    let bookmarks = JSON.parse(localStorage.getItem('faekson_bookmarks')) || [];
    let searchHistory = JSON.parse(localStorage.getItem('faekson_history')) || [];
    let currentCategory = 'all';
    let isShowingBookmarks = false;
    let activeTab = 'local';
    let cachedLocalResults = [];
    let cachedCloudResults = [];

    async function init() {
      updateBookmarkBadge();
      initQuickNotes();
      try {
        const fetchUrl = 'https://raw.githubusercontent.com/FR2027/Faekson_2/refs/heads/main/data.json?v=' + new Date().getTime();
        const res = await fetch(fetchUrl);
        if (!res.ok) throw new Error('HTTP error');
        allData = await res.json();
      } catch (err) {
        console.warn('載入遠端數據失敗，改用預設空陣列');
        allData = [];
      }
    }

    function renderSkeletonCards() {
      return `
        <div class="clean-card rounded-2xl p-4 flex flex-col gap-3 animate-skeleton">
          <div class="w-full h-32 bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
          <div class="w-3/4 h-4 bg-slate-200 dark:bg-slate-800 rounded"></div>
          <div class="w-full h-8 bg-slate-200 dark:bg-slate-800 rounded"></div>
        </div>
        <div class="clean-card rounded-2xl p-4 flex flex-col gap-3 animate-skeleton">
          <div class="w-full h-32 bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
          <div class="w-2/3 h-4 bg-slate-200 dark:bg-slate-800 rounded"></div>
          <div class="w-full h-8 bg-slate-200 dark:bg-slate-800 rounded"></div>
        </div>
      `;
    }

    function renderCardHTML(item, index, prefixId) {
      const isBookmarked = bookmarks.some(b => b.id === item.id);
      const imageUrl = item.image || item.img || item.cover;
      const safeSnippet = item.snippet || item.description || '';
      const uniqueId = item.id || (prefixId + '_' + index);

      return `
        <div class="clean-card rounded-2xl p-4 flex flex-col justify-between">
          <div>
            ${imageUrl ? `
              <div class="w-full h-36 mb-3 rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-900 border border-slate-200/50 dark:border-slate-800/50 relative group/img">
                <img src="${imageUrl}" alt="${item.title || ''}" class="w-full h-full object-cover group-hover/img:scale-105 transition duration-300" onerror="this.style.display='none'" />
              </div>
            ` : ''}

            <div class="flex items-start justify-between gap-2 mb-2">
              <a href="${item.url || '#'}" target="_blank" class="font-bold text-sm text-slate-900 dark:text-white hover:text-blue-600 dark:hover:text-blue-400 transition line-clamp-1 flex items-center gap-1.5 group/link">
                <span>${item.title || '無標題'}</span>
                <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-0 group-hover/link:opacity-100 transition"></i>
              </a>
              
              <div class="flex items-center gap-1 shrink-0">
                <button onclick="copyUrl('${item.url || ''}')" title="複製連結" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-200/50 dark:hover:bg-slate-800 transition">
                  <i class="fa-regular fa-copy text-xs"></i>
                </button>
                <button onclick="toggleBookmark('${uniqueId}')" title="收藏" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800 transition">
                  <i class="fa-${isBookmarked ? 'solid' : 'regular'} fa-star text-xs ${isBookmarked ? 'text-amber-400' : ''}"></i>
                </button>
              </div>
            </div>

            <p class="text-xs text-slate-600 dark:text-slate-300 line-clamp-2 leading-relaxed mb-3">${safeSnippet}</p>
          </div>

          <div>
            ${item.tags && item.tags.length > 0 ? `
              <div class="flex flex-wrap gap-1 mb-3">
                ${item.tags.map(tag => {
                  const safeTag = String(tag).replace(/'/g, "\\'");
                  return `<span onclick="clickTagSearch('${safeTag}')" class="cursor-pointer text-[10px] font-medium px-2 py-0.5 rounded-md bg-blue-500/10 text-blue-600 dark:text-blue-300 hover:bg-blue-500/20 transition">#${tag}</span>`;
                }).join('')}
              </div>
            ` : ''}

            <a href="${item.url || '#'}" target="_blank" class="text-[10px] font-mono text-slate-400 dark:text-slate-500 truncate block hover:text-blue-500 transition">
              <i class="fa-solid fa-globe mr-1 opacity-60"></i>${item.url || ''}
            </a>
          </div>
        </div>
      `;
    }

    function renderLocalResults(list) {
      const container = document.getElementById('local-results-container');
      document.getElementById('local-count').innerText = list.length;
      if (list.length === 0) {
        container.innerHTML = `<div class="col-span-full py-8 text-center text-xs text-slate-400 clean-card rounded-xl">無本地資料</div>`;
        return;
      }
      container.innerHTML = list.map((item, index) => renderCardHTML(item, index, 'local')).join('');
    }

    function renderCloudResults(list) {
      const container = document.getElementById('cloud-results-container');
      document.getElementById('cloud-count').innerText = list.length;
      if (list.length === 0) {
        container.innerHTML = `<div class="col-span-full py-8 text-center text-xs text-slate-400 clean-card rounded-xl">無網路搜尋結果</div>`;
        return;
      }
      container.innerHTML = list.map((item, index) => renderCardHTML(item, index, 'cloud')).join('');
    }

    function switchToSearchMode() {
      document.getElementById('home-hero-zone').classList.add('hidden');
      document.getElementById('main-layout').classList.remove('justify-center');
      document.getElementById('results-wrapper').classList.remove('hidden');
      document.getElementById('results-wrapper').classList.add('flex');
    }

    function handleTyping() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      const clearBtn = document.getElementById('clear-btn');
      const box = document.getElementById('suggestions-box');
      const list = document.getElementById('suggestions-list');

      clearBtn.classList.toggle('hidden', query === '');

      if (!query) {
        box.classList.add('hidden');
        return;
      }

      const matchedTitles = allData
        .filter(item => 
          (item.title && String(item.title).toLowerCase().includes(query)) || 
          (item.tags || []).some(t => String(t).toLowerCase().includes(query))
        )
        .slice(0, 4);

      if (matchedTitles.length === 0) {
        box.classList.add('hidden');
        return;
      }

      list.innerHTML = matchedTitles.map(item => {
        const safeTitle = (item.title || '').replace(/'/g, "\\'");
        return `
          <div onclick="selectSuggestion('${safeTitle}')" class="px-3.5 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer flex items-center justify-between transition text-xs text-slate-700 dark:text-slate-200">
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-magnifying-glass text-[10px] text-blue-500"></i>
              <span>${item.title || ''}</span>
            </div>
            <i class="fa-solid fa-arrow-up-left text-[10px] text-slate-400"></i>
          </div>
        `;
      }).join('');

      box.classList.remove('hidden');
    }

    function hideSuggestions(e) {
      if (!e.target.closest('#suggestions-box') && !e.target.closest('#search-input')) {
        document.getElementById('suggestions-box').classList.add('hidden');
      }
    }

    function selectSuggestion(text) {
      document.getElementById('search-input').value = text;
      document.getElementById('suggestions-box').classList.add('hidden');
      executeSearch();
    }

    function submitSearch(e) {
      if (e) e.preventDefault();
      document.getElementById('suggestions-box').classList.add('hidden');
      executeSearch();
    }

    function clickTagSearch(tag) {
      document.getElementById('search-input').value = tag;
      executeSearch();
    }

    async function executeSearch() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();

      if (!query && currentCategory === 'all' && !isShowingBookmarks) {
        resetToHome();
        return;
      }

      switchToSearchMode();
      if (isShowingBookmarks) isShowingBookmarks = false;

      if (query && !searchHistory.includes(query)) {
        searchHistory.unshift(query);
        if (searchHistory.length > 15) searchHistory.pop();
        localStorage.setItem('faekson_history', JSON.stringify(searchHistory));
      }

      document.getElementById('local-results-container').innerHTML = renderSkeletonCards();
      document.getElementById('cloud-results-container').innerHTML = renderSkeletonCards();

      const startTime = performance.now();

      // 1. 本地過濾
      let filteredLocal = allData;
      if (currentCategory !== 'all') {
        filteredLocal = filteredLocal.filter(item => 
          (item.tags || []).some(t => String(t).toLowerCase() === currentCategory.toLowerCase()) ||
          (item.title && String(item.title).toLowerCase().includes(currentCategory.toLowerCase()))
        );
      }
      if (query) {
        filteredLocal = filteredLocal.filter(item => 
          (item.title && String(item.title).toLowerCase().includes(query)) ||
          (item.snippet && String(item.snippet).toLowerCase().includes(query)) ||
          (item.description && String(item.description).toLowerCase().includes(query)) ||
          (item.tags || []).some(t => String(t).toLowerCase().includes(query))
        );
      }
      cachedLocalResults = filteredLocal;
      renderLocalResults(cachedLocalResults);

      // 2. 網路引擎查詢
      let cloudResults = [];
      if (query) {
        try {
          const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent('https://html.duckduckgo.com/html/?q=' + encodeURIComponent(query))}`;
          const res = await fetch(proxyUrl);
          const data = await res.json();
          if (data && data.contents) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(data.contents, 'text/html');
            doc.querySelectorAll('.result').forEach((el, idx) => {
              const titleEl = el.querySelector('.result__title');
              const snippetEl = el.querySelector('.result__snippet');
              const linkEl = el.querySelector('.result__url');
              if (titleEl && linkEl) {
                cloudResults.push({
                  id: 'cloud_' + idx,
                  title: titleEl.textContent.trim(),
                  snippet: snippetEl ? snippetEl.textContent.trim() : '無摘要',
                  url: linkEl.href || '#',
                  tags: ['網路']
                });
              }
            });
          }
        } catch (err) {
          console.warn('網路搜尋失敗');
        }
      }
      cachedCloudResults = cloudResults.slice(0, 8);
      renderCloudResults(cachedCloudResults);

      const endTime = performance.now();
      document.getElementById('search-time-stats').innerText = `耗時 ${(endTime - startTime).toFixed(0)}ms`;
    }

    function switchResultTab(tab) {
      activeTab = tab;
      const localBtn = document.getElementById('tab-local-btn');
      const cloudBtn = document.getElementById('tab-cloud-btn');
      const localPane = document.getElementById('local-pane');
      const cloudPane = document.getElementById('cloud-pane');

      if (tab === 'local') {
        localBtn.className = 'px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white transition shadow-sm';
        cloudBtn.className = 'px-4 py-2 rounded-xl text-xs font-semibold bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition';
        localPane.classList.remove('hidden');
        cloudPane.classList.add('hidden');
      } else {
        cloudBtn.className = 'px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white transition shadow-sm';
        localBtn.className = 'px-4 py-2 rounded-xl text-xs font-semibold bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition';
        cloudPane.classList.remove('hidden');
        localPane.classList.add('hidden');
      }
    }

    function filterCategory(cat, e) {
      if (currentCategory === cat) {
        currentCategory = 'all';
      } else {
        currentCategory = cat;
      }
      
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('bg-slate-200/60', 'dark:bg-slate-800/80', 'text-slate-700', 'dark:text-slate-300');
      });
      
      if (currentCategory !== 'all' && e && e.currentTarget) {
        e.currentTarget.classList.remove('bg-slate-200/60', 'dark:bg-slate-800/80', 'text-slate-700', 'dark:text-slate-300');
        e.currentTarget.classList.add('bg-blue-600', 'text-white');
      }

      executeSearch();
    }

    function resetToHome() {
      document.getElementById('search-input').value = '';
      document.getElementById('clear-btn').classList.add('hidden');
      document.getElementById('suggestions-box').classList.add('hidden');
      currentCategory = 'all';
      isShowingBookmarks = false;

      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('bg-slate-200/60', 'dark:bg-slate-800/80', 'text-slate-700', 'dark:text-slate-300');
      });

      document.getElementById('home-hero-zone').classList.remove('hidden');
      document.getElementById('main-layout').classList.add('justify-center');
      document.getElementById('results-wrapper').classList.add('hidden');
      document.getElementById('results-wrapper').classList.remove('flex');
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      document.getElementById('clear-btn').classList.add('hidden');
      document.getElementById('suggestions-box').classList.add('hidden');
      executeSearch();
    }

    function toggleBookmark(id) {
      const index = bookmarks.findIndex(b => b.id === id);
      const targetItem = allData.find(item => item.id === id);

      if (index > -1) {
        bookmarks.splice(index, 1);
        showToast('已取消收藏');
      } else if (targetItem) {
        bookmarks.push(targetItem);
        showToast('已加入收藏');
      }

      localStorage.setItem('faekson_bookmarks', JSON.stringify(bookmarks));
      updateBookmarkBadge();

      if (isShowingBookmarks) {
        renderLocalResults(bookmarks);
      } else {
        executeSearch();
      }
    }

    function updateBookmarkBadge() {
      const badge = document.getElementById('bookmark-count-badge');
      if (badge) badge.innerText = bookmarks.length;
    }

    function toggleBookmarksView() {
      isShowingBookmarks = !isShowingBookmarks;
      if (isShowingBookmarks) {
        switchToSearchMode();
        switchResultTab('local');
        renderLocalResults(bookmarks);
        renderCloudResults([]);
        showToast('顯示我的收藏');
      } else {
        executeSearch();
      }
    }

    function toggleHistoryModal() {
      const modal = document.getElementById('history-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        renderHistoryList();
      }
    }

    function renderHistoryList() {
      const listContainer = document.getElementById('history-list');
      if (searchHistory.length === 0) {
        listContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-4">無歷史紀錄</p>`;
        return;
      }
      listContainer.innerHTML = searchHistory.map(item => `
        <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-900/60 hover:bg-slate-200/60 dark:hover:bg-slate-800 transition">
          <span onclick="selectHistoryItem('${item}')" class="text-xs text-slate-700 dark:text-slate-200 cursor-pointer flex-1 truncate"><i class="fa-solid fa-clock mr-2 text-slate-400"></i>${item}</span>
          <button onclick="removeHistoryItem('${item}')" class="text-slate-400 hover:text-red-500 px-2 text-xs"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `).join('');
    }

    function selectHistoryItem(term) {
      document.getElementById('search-input').value = term;
      toggleHistoryModal();
      executeSearch();
    }

    function removeHistoryItem(term) {
      searchHistory = searchHistory.filter(i => i !== term);
      localStorage.setItem('faekson_history', JSON.stringify(searchHistory));
      renderHistoryList();
    }

    function clearHistory() {
      searchHistory = [];
      localStorage.removeItem('faekson_history');
      renderHistoryList();
      showToast('已清除歷史');
    }

    function toggleNotesModal() {
      document.getElementById('notes-modal').classList.toggle('hidden');
    }

    function initQuickNotes() {
      const savedNotes = localStorage.getItem('faekson_quick_notes') || '';
      const textarea = document.getElementById('quick-notes-input');
      if (textarea) textarea.value = savedNotes;
      if (savedNotes.trim() !== '') {
        document.getElementById('notes-indicator').classList.remove('hidden');
      }
    }

    function saveQuickNotes() {
      const textarea = document.getElementById('quick-notes-input');
      const val = textarea ? textarea.value : '';
      localStorage.setItem('faekson_quick_notes', val);
      const indicator = document.getElementById('notes-indicator');
      if (val.trim() !== '') {
        indicator.classList.remove('hidden');
      } else {
        indicator.classList.add('hidden');
      }
    }

    function copyUrl(url) {
      if (!url) return;
      navigator.clipboard.writeText(url).then(() => {
        showToast('已複製連結');
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      if (toast && toastMsg) {
        toastMsg.innerText = msg;
        toast.classList.remove('translate-y-16', 'opacity-0');
        setTimeout(() => {
          toast.classList.add('translate-y-16', 'opacity-0');
        }, 1800);
      }
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        icon.className = 'fa-solid fa-sun text-sm text-amber-500';
        showToast('明亮模式');
      } else {
        html.classList.add('dark');
        icon.className = 'fa-solid fa-moon text-sm text-slate-200';
        showToast('深色模式');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      init();
    });
  </script>
</body>
</html>
